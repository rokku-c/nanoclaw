apiVersion: apps/v1
kind: Deployment
metadata:
  name: mr5-service-075
  labels:
    app: mr5-service-075
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mr5-service-075
  template:
    metadata:
      labels:
        app: mr5-service-075
    spec:
      containers:
      - name: app
        image: registry.example.invalid/mr5/service:075
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
