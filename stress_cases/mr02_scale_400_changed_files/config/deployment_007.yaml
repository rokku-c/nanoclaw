apiVersion: apps/v1
kind: Deployment
metadata:
  name: scale-400-privileged-worker-007
  labels:
    app: scale-test
    scale: "400"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scale-400-privileged-worker-007
  template:
    metadata:
      labels:
        app: scale-400-privileged-worker-007
    spec:
      containers:
        - name: worker
          image: example.invalid/scale-worker:400-007
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
